<div class="container-fluid">
    <div class="row bg-secondary py-1 px-xl-5">
        <div class="col-lg-6 d-none d-lg-block">
            <div class="d-inline-flex align-items-center h-100">
                <a class="text-body mr-3" href="{% url 'contact' %}">Contact</a>
                {% if request.user.is_authenticated %}
                <a class="text-body mr-3" href="{% url 'likes' %}">Liked</a>
                <a class="text-body mr-3" href="{% url 'basket' %}">Cart</a>
                {% endif %}
            </div>
        </div>
        <div class="col-lg-6 text-center text-lg-right">
            <div class="d-inline-flex align-items-center">
                <div class="btn-group">
                    <button type="button" class="btn btn-sm btn-light dropdown-toggle" data-toggle="dropdown">
                        {% if request.user.is_authenticated %}{{ request.user.username }}{% else %}My Account{% endif %}
                    </button>
                    <div class="dropdown-menu dropdown-menu-right">
                        {% if not request.user.is_authenticated %}
                        <a class="dropdown-item" href="{% url 'signin' %}">Sign in</a>
                        <a class="dropdown-item" href="{% url 'signup' %}">Sign up</a>
                        {% else %}
                        <a class="dropdown-item" href="{% url 'likes' %}">Liked products</a>
                        <a class="dropdown-item" href="{% url 'basket' %}">My cart</a>
                        <a class="dropdown-item" href="{% url 'signout' %}">Sign out</a>
                        {% endif %}
                    </div>
                </div>
                <div class="btn-group mx-2">
                    <button type="button" class="btn btn-sm btn-light dropdown-toggle" data-toggle="dropdown">USD
                    </button>
                    <div class="dropdown-menu dropdown-menu-right">
                        <button class="dropdown-item" type="button">EUR</button>
                        <button class="dropdown-item" type="button">GBP</button>
                        <button class="dropdown-item" type="button">CAD</button>
                    </div>
                </div>
                <div class="btn-group">
                    <button type="button" class="btn btn-sm btn-light dropdown-toggle" data-toggle="dropdown">EN
                    </button>
                    <div class="dropdown-menu dropdown-menu-right">
                        <button class="dropdown-item" type="button">FR</button>
                        <button class="dropdown-item" type="button">AR</button>
                        <button class="dropdown-item" type="button">RU</button>
                    </div>
                </div>
            </div>
            <!-- Telefon uchun yurak va savat -->
            <div class="d-inline-flex d-lg-none align-items-center">
                <a href="{% if request.user.is_authenticated %}{% url 'likes' %}{% else %}{% url 'signin' %}{% endif %}" class="btn px-0 ml-2">
                    <i class="fas fa-heart text-dark"></i>
                    <span class="badge text-dark border border-dark rounded-circle"
                          style="padding-bottom: 2px;" data-count="likes">{{ likes_count }}</span>
                </a>
                <a href="{% if request.user.is_authenticated %}{% url 'basket' %}{% else %}{% url 'signin' %}{% endif %}" class="btn px-0 ml-2">
                    <i class="fas fa-shopping-cart text-dark"></i>
                    <span class="badge text-dark border border-dark rounded-circle"
                          style="padding-bottom: 2px;" data-count="basket">{{ basket_count }}</span>
                </a>
            </div>
        </div>
    </div>
    <div class="row align-items-center bg-light py-3 px-xl-5 d-none d-lg-flex">
        <div class="col-lg-4">
            <a href="{% url 'home' %}" class="text-decoration-none">
                <span class="h1 text-uppercase text-primary bg-dark px-2">Multi</span>
                <span class="h1 text-uppercase text-dark bg-primary px-2 ml-n1">Shop</span>
            </a>
        </div>
        <div class="col-lg-4 col-6 text-left">
            <form action="{% url 'search' %}">
                <div class="input-group">
                    <input name="q" type="text" class="form-control" placeholder="Search for products">
                    <div class="input-group-append">
                            <span class="input-group-text bg-transparent text-primary">
                                <i class="fa fa-search"></i>
                            </span>
                    </div>
                </div>
            </form>
        </div>
        <div class="col-lg-4 col-6 text-right">
            <p class="m-0">Customer Service</p>
            <h5 class="m-0">+012 345 6789</h5>
        </div>
    </div>
</div>
