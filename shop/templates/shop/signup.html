{% extends 'base.html' %}

{% block main %}
<!-- Signup Start -->
<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-12 col-sm-10 col-md-8 col-lg-5">
            <div class="bg-light p-30 auth-card">
                <h3 class="text-center mb-4">REGISTER</h3>
                <form action="{% url 'signup' %}" method="post" enctype="multipart/form-data">
                    {% csrf_token %}
                    {{ form.as_p }}
                    <button class="btn btn-primary btn-block py-2 mt-2" type="submit">Sign Up</button>
                </form>
                <p class="text-center mt-3 mb-0">Akkaunting bormi? <a href="{% url 'signin' %}">Kirish</a></p>
            </div>
        </div>
    </div>
</div>
<!-- Signup End -->
{% endblock main %}
