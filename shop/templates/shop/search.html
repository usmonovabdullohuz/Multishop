{% extends 'base.html' %}

{% block main %}
<div class="container">
    {% if products %}
    <h2>Searching Products</h2>
    {% else %}
    <h2>No Products</h2>
    {% endif %}
    <div class="row">
        {% for product in products %}
        <div class="col-lg-4 col-md-6 col-sm-6 pb-1">
            {% include 'shop/components/product.html' %}
        </div>
        {% endfor %}
    </div>
</div>
{% endblock main %}
